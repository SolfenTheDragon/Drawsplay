[package]
name = "dd-host"
version.workspace = true
edition.workspace = true

[dependencies]
dd-proto = { path = "../proto" }
enigo = "0.3"
getrandom = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Networking_WinSock", "Win32_Devices_Display",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_HiDpi",
  "Win32_Security", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2.191"
zbus = "5"
serde = "1.0.229"
