[workspace]
resolver = "2"
members = ["proto", "host", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

# Dependencies more than one crate uses. Every version here and in the crates
# names a compatible series ("1", "0.3"); Cargo.lock pins the exact release.
[workspace.dependencies]
dd-proto = { path = "proto" }
getrandom = "0.3"
windows = "0.58"

# The temporary winit Git backport otherwise selects its older in-tree DPI crate.
[patch."https://github.com/shtse8/winit"]
dpi = "=0.1.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Integer overflow panics (that thread only) instead of wrapping silently in our own code, where sizes and
# counts come from the network. Dependencies keep the normal release behaviour.
[profile.release.package.dd-proto]
overflow-checks = true

[profile.release.package.dd-host]
overflow-checks = true

[profile.release.package.dd-client]
overflow-checks = true
