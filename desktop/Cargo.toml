[workspace]
resolver = "2"
members = ["proto", "host", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1
# Integer overflow panics (that thread only) instead of wrapping silently: sizes and counts come from the network.
overflow-checks = true
