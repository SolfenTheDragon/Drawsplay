name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin --tags
            python3 - <<'PY'
          import os
          import re
          import subprocess

          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          versions = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag))
          ]
          major, minor, patch = max(versions, default=(0, 0, 0))
          tag = f"v{major}.{minor}.{patch + 1}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          print(f"Next release tag: {tag}")
          PY
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build-windows-android:
    needs: resolve-tag
    runs-on: windows-latest
    env:
      DRAWSPLAY_REQUIRE_SIGNING: ${{ vars.DRAWSPLAY_REQUIRE_SIGNING || '0' }}
      DRAWSPLAY_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      DRAWSPLAY_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
      DRAWSPLAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DRAWSPLAY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DRAWSPLAY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Prepare signing materials
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $requireSigning = $env:DRAWSPLAY_REQUIRE_SIGNING -in @("1", "true", "yes")
          $signingGroups = @(
            @{
              Name = "Windows"
              Secrets = @{
                WINDOWS_SIGNING_PFX_BASE64 = $env:WINDOWS_SIGNING_PFX_BASE64
                WINDOWS_SIGNING_PFX_PASSWORD = $env:DRAWSPLAY_WINDOWS_SIGNING_PFX_PASSWORD
              }
              FileName = "drawsplay-signing-cert.pfx"
              Encoded = $env:WINDOWS_SIGNING_PFX_BASE64
              PathVariable = "DRAWSPLAY_WINDOWS_SIGNING_PFX_PATH"
            },
            @{
              Name = "Android"
              Secrets = @{
                ANDROID_KEYSTORE_BASE64 = $env:ANDROID_KEYSTORE_BASE64
                ANDROID_KEYSTORE_PASSWORD = $env:DRAWSPLAY_ANDROID_KEYSTORE_PASSWORD
                ANDROID_KEY_ALIAS = $env:DRAWSPLAY_ANDROID_KEY_ALIAS
                ANDROID_KEY_PASSWORD = $env:DRAWSPLAY_ANDROID_KEY_PASSWORD
              }
              FileName = "drawsplay-android-release.keystore"
              Encoded = $env:ANDROID_KEYSTORE_BASE64
              PathVariable = "DRAWSPLAY_ANDROID_KEYSTORE_FILE"
            }
          )

          foreach ($group in $signingGroups) {
            $missing = @($group.Secrets.Keys | Where-Object {
              [string]::IsNullOrWhiteSpace($group.Secrets[$_])
            })
            if ($missing.Count -eq $group.Secrets.Count -and -not $requireSigning) {
              if ($group.Name -eq "Windows") {
                Write-Host "::warning::Windows signing is not configured; releasing an unsigned EXE."
              } else {
                Write-Host "::warning::Android signing is not configured; releasing a debug-signed APK. Updates across runs may require reinstalling the app."
              }
              continue
            }
            if ($missing.Count -gt 0) {
              throw "$($group.Name) signing configuration is incomplete. Missing secrets: $($missing -join ', ')"
            }
            $path = Join-Path $env:RUNNER_TEMP $group.FileName
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($group.Encoded))
            "$($group.PathVariable)=$path" >> $env:GITHUB_ENV
          }

      - name: Build Windows host and Android APK
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: .\scripts\build-release.ps1 -Version $env:RELEASE_TAG

      - name: Upload Windows and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-android-release
          if-no-files-found: error
          path: |
            release/drawsplay_installer_*.exe
            release/DrawSplay.APK
            release/DrawSplay-host-windows.zip
            release/DrawSplay-android-release.zip

  build-linux:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      - name: Build Linux host
        working-directory: host
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          mkdir -p ../release
          go build -trimpath -ldflags "-X main.version=${RELEASE_TAG}" -o ../release/drawsplay-host-linux-amd64 .
          chmod +x ../release/drawsplay-host-linux-amd64
          cp ../scripts/install-host-linux.sh ../release/install-drawsplay-host-linux.sh
          cp ../scripts/uninstall-host-linux.sh ../release/uninstall-drawsplay-host-linux.sh
          cp drawsplay-tray.png ../release/drawsplay-tray.png
          cp ../packaging/linux/70-drawsplay-aoa.rules ../release/70-drawsplay-aoa.rules
          chmod +x ../release/install-drawsplay-host-linux.sh ../release/uninstall-drawsplay-host-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            release/drawsplay-host-linux-amd64
            release/install-drawsplay-host-linux.sh
            release/uninstall-drawsplay-host-linux.sh
            release/drawsplay-tray.png
            release/70-drawsplay-aoa.rules

  publish-release:
    runs-on: ubuntu-latest
    concurrency:
      group: drawsplay-release-publication
      cancel-in-progress: false
    needs:
      - resolve-tag
      - build-windows-android
      - build-linux
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows and Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-android-release
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release

      - name: Bundle per-platform folders
        working-directory: release
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          win="DrawSplay-windows-${RELEASE_TAG}"
          mkdir "$win"
          cp "drawsplay_installer_${RELEASE_TAG}.exe" DrawSplay.APK "$win/"
          zip -r "${win}.zip" "$win"

          lin="DrawSplay-linux-${RELEASE_TAG}"
          mkdir "$lin"
          cp drawsplay-host-linux-amd64 install-drawsplay-host-linux.sh \
            uninstall-drawsplay-host-linux.sh drawsplay-tray.png \
            70-drawsplay-aoa.rules DrawSplay.APK "$lin/"
          chmod +x "$lin/drawsplay-host-linux-amd64" "$lin"/*.sh
          tar -czf "${lin}.tar.gz" "$lin"

      - name: Generate SHA-256 checksums
        working-directory: release
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          sha256sum \
            "DrawSplay-windows-${RELEASE_TAG}.zip" \
            "DrawSplay-linux-${RELEASE_TAG}.tar.gz" \
            DrawSplay.APK > SHA256SUMS.txt

      - name: Generate release patch notes
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["GITHUB_SHA"]
          tags = subprocess.check_output(
              ["git", "tag", "--merged", commit], text=True
          ).splitlines()
          versions = [
              (tuple(map(int, match.groups())), candidate)
              for candidate in tags
              if candidate != tag
              and (match := re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", candidate))
          ]
          current = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", tag)
          if current:
              versions = [
                  item for item in versions
                  if item[0] < tuple(map(int, current.groups()))
              ]
          previous = max(versions)[1] if versions else None
          revision = f"{previous}..{commit}" if previous else commit
          changes = subprocess.check_output(
              ["git", "log", "--reverse", "--format=- %s (%h)", revision],
              text=True,
          ).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          notes = f"# DrawSplay {tag}\n\n## Changes\n\n"
          notes += changes or "No new commits since the previous release."
          if previous:
              notes += f"\n\n[Full changelog](https://github.com/{repository}/compare/{previous}...{tag})"
          notes += (
              "\n\n## Downloads\n\n"
              f"- **Windows:** `DrawSplay-windows-{tag}.zip` (extract the folder and run `drawsplay_installer_{tag}.exe`; it adds an uninstaller and Apps & Features entry)\n"
              f"- **Linux (amd64):** `DrawSplay-linux-{tag}.tar.gz` (extract the folder and run `./install-drawsplay-host-linux.sh`; run `./uninstall-drawsplay-host-linux.sh` to remove it)\n"
              "- **Android:** `DrawSplay.APK` (also included in both folders)\n"
              "\nUse `SHA256SUMS.txt` to verify your downloads.\n"
          )
          Path("release/PATCH_NOTES.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release/PATCH_NOTES.md
          files: |
            release/DrawSplay-windows-${{ needs.resolve-tag.outputs.tag }}.zip
            release/DrawSplay-linux-${{ needs.resolve-tag.outputs.tag }}.tar.gz
            release/DrawSplay.APK
            release/SHA256SUMS.txt
