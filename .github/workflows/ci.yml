name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Check shell script syntax
        run: |
          shopt -s nullglob
          for script in scripts/*.sh release/*.sh tools/android_wifi_probe/*.sh; do
            bash -n "$script"
          done

      - name: Test external USB measurement tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/usb_baseline -p 'test_*.py' -v

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod

      - name: Vet host
        run: go vet ./...

      - name: Vet host for Windows and an unsupported platform (missing fallbacks)
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: Test host (race detector)
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build host (linux)
        run: go build -o host .

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install build libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxcursor-dev libxi-dev libxrandr-dev libxdo-dev libxtst-dev libudev-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test DrawSplay Desktop
        run: cargo test --release --locked

  host-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod

      - name: Test host (windows)
        run: go test ./...

      - name: Build the Windows native media helper
        working-directory: native/drawsplay-media-win
        run: .\build.ps1

  native-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/drawsplay-media
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libva-dev libx11-dev libxext-dev \
            libxdamage-dev libxfixes-dev zlib1g-dev

      - name: Build the Linux native media helper (warnings are errors)
        run: make CC="cc -Werror"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go for Wi-Fi pairing interoperability
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod

      - name: Build offline Wi-Fi pairing test peer
        run: |
          (cd ../host && go build -o "$RUNNER_TEMP/wifi-pairing-test-peer" ./cmd/wifi-pairing-test-peer)
          echo "DRAWSPLAY_PAIRING_TEST_PEER=$RUNNER_TEMP/wifi-pairing-test-peer" >> "$GITHUB_ENV"

      - name: Compile Android release Kotlin
        run: ./gradlew :app:compileReleaseKotlin

      - name: Test isolated Android crypto probe
        run: |
          mkdir -p "$RUNNER_TEMP/drawsplay-crypto-probe"
          javac --release 8 -d "$RUNNER_TEMP/drawsplay-crypto-probe" ../tools/android_crypto_probe/*.java
          java -cp "$RUNNER_TEMP/drawsplay-crypto-probe" com.drawsplay.benchmark.CryptoProbeTest

      - name: Run Android unit tests
        run: ./gradlew :app:testReleaseUnitTest

      - name: Assemble Android release APK
        run: ./gradlew :app:assembleRelease

      - name: Assemble Android release App Bundle (Google Play)
        run: ./gradlew :app:bundleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DrawSplay-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DrawSplay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
