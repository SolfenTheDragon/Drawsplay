name: Desktop dependency audit

# Checks the DrawSplay Desktop dependency list against the RustSec advisory database. New advisories
# appear without any change to this repository, so it also runs every week.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "desktop/Cargo.lock"
      - "desktop/**/Cargo.toml"
      - ".github/workflows/desktop-audit.yml"
  pull_request:
    paths:
      - "desktop/Cargo.lock"
      - "desktop/**/Cargo.toml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Known vulnerabilities fail the job; "unmaintained" notices are printed but do not.
      - name: Audit desktop/Cargo.lock
        run: cargo audit --file desktop/Cargo.lock
